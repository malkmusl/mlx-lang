# brixOS's desktop settings for everyone: what the login screen shows, and
# the desktop of a user whose ~/.config/mlx/compositor.conf names neither.
# The same keys as compositor.conf (projects/desktop/shared/backdrop.mlx):
#
#   wallpaper = /system/share/wallpapers/NAME.png   (a PNG or JPEG; none:
#                                                    a backdrop made of the
#                                                    colours)
#   accent-color = #7c5cff                          (the colour the
#                                                    desktop's colours come
#                                                    from; auto: from the
#                                                    wallpaper)
