# The default apps for everyone, by file extension
# (projects/desktop/shared/defaults.mlx): .EXT = APP_ID ("." alone: files
# without an extension). Each user's own choices (Polaris's Open with
# popup; Control: Apps) go to ~/.config/mlx/defaults.conf and come first.
# An extension named nowhere is asked for when a file of it is opened.
.txt = org.mlx.comet
.md = org.mlx.comet
.mlx = org.mlx.comet
.c = org.mlx.comet
.h = org.mlx.comet
.cc = org.mlx.comet
.cpp = org.mlx.comet
.hpp = org.mlx.comet
.zig = org.mlx.comet
.rs = org.mlx.comet
.sh = org.mlx.comet
.conf = org.mlx.comet
.ini = org.mlx.comet
.cfg = org.mlx.comet
.toml = org.mlx.comet
.yaml = org.mlx.comet
.yml = org.mlx.comet
.json = org.mlx.comet
.xml = org.mlx.comet
.csv = org.mlx.comet
.log = org.mlx.comet
.py = org.mlx.comet
.js = org.mlx.comet
.ts = org.mlx.comet
.css = org.mlx.comet
.service = org.mlx.comet
.desktop = org.mlx.comet
.xkb = org.mlx.comet
.html = org.mlx.voyager
.htm = org.mlx.voyager
