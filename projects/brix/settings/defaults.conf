# The default apps for everyone (projects/desktop/shared/defaults.mlx):
# TYPE = APP_ID, a TYPE a MIME type or a kind of them ("text/*"). Each
# user's own choices (Control: Apps; Polaris: Always open with) go to
# ~/.config/mlx/defaults.conf and come first.
text/* = org.mlx.comet
application/json = org.mlx.comet
inode/directory = org.mlx.files
