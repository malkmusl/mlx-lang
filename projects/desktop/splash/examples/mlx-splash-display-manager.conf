# A drop-in for the display manager's unit: before it takes the screen,
# the boot splash ends, leaving its last frame until the display manager
# shows its own (no text console in between). tools/install_splash.sh
# puts it into the drop-in directory of the unit display-manager.service
# names. Without a splash running it does nothing.
[Unit]
After=mlx-splash.service

[Service]
ExecStartPre=-@BINDIR@/mlx-splashctl quit --retain-splash
