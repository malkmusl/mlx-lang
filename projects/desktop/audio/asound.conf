# ALSA programs play and record through MLX Audio: its PulseAudio socket,
# by alsa-plugins' pulse plugin (libasound_module_pcm_pulse.so; it needs
# libpulse, PulseAudio's client library, not its server). The desktop
# session adds this file after ALSA's own (ALSA_CONFIG_PATH), so it wins
# over a default another sound server's package set (pipewire-alsa's
# 99-pipewire-default.conf).
pcm.!default {
    type pulse
    hint {
        show on
        description "MLX Audio"
    }
}
ctl.!default {
    type pulse
}
