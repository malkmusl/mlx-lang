<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The families of WebKitTestRunner's GLib fonts.conf (Tools/WebKitTestRunner/glib/fonts/fonts.conf at 2.54.1's revision): the generic and common families as Liberation's. tools/check_webkit_mlx_layout.sh includes it with the directory of the Liberation fonts. -->
<fontconfig>
    <match target="pattern"><test qual="any" name="family"><string>serif</string></test><edit name="family" mode="assign"><string>Liberation Serif</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>Times</string></test><edit name="family" mode="assign"><string>Liberation Serif</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>Times New Roman</string></test><edit name="family" mode="assign"><string>Liberation Serif</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>cursive</string></test><edit name="family" mode="assign"><string>Liberation Serif</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>fantasy</string></test><edit name="family" mode="assign"><string>Liberation Serif</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>sans serif</string></test><edit name="family" mode="assign"><string>Liberation Sans</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>sans-serif</string></test><edit name="family" mode="assign"><string>Liberation Sans</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>sans</string></test><edit name="family" mode="assign"><string>Liberation Sans</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>Helvetica</string></test><edit name="family" mode="assign"><string>Liberation Sans</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>Arial</string></test><edit name="family" mode="assign"><string>Liberation Sans</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>Lucida Grande</string></test><edit name="family" mode="assign"><string>Liberation Sans</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>monospace</string></test><edit name="family" mode="assign"><string>Liberation Mono</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>mono</string></test><edit name="family" mode="assign"><string>Liberation Mono</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>Courier</string></test><edit name="family" mode="assign"><string>Liberation Mono</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>Courier New</string></test><edit name="family" mode="assign"><string>Liberation Mono</string></edit></match>
    <match target="pattern"><test qual="any" name="family"><string>Monaco</string></test><edit name="family" mode="assign"><string>Liberation Mono</string></edit></match>
</fontconfig>
