<!DOCTYPE html>
<title>xhr</title>
<script>
function line(text) { document.body.appendChild(document.createElement("p")).textContent = text; }
var xhr = new XMLHttpRequest();
xhr.open("GET", "/json");
xhr.responseType = "json";
xhr.onload = function () {
    line("xhr status " + xhr.status + " answer " + xhr.response.answer);
    var post = new XMLHttpRequest();
    post.open("POST", "/echo");
    post.setRequestHeader("Content-Type", "text/plain");
    post.onload = function () { line("xhr post: " + post.responseText.replace(/\n/g, " | ")); document.title = "xhr done"; };
    post.send("posted by xhr");
};
xhr.onerror = function () { line("xhr failed"); };
xhr.send();
</script>
