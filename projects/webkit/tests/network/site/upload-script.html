<!DOCTYPE html>
<title>upload script</title>
<input id="file" type="file" multiple>
<pre id="out"></pre>
<script>
var out = document.getElementById("out");
function say(text) { out.textContent += text + "\n"; }
document.getElementById("file").onchange = function () {
    var files = this.files;
    say("files " + files.length);
    var pending = files.length;
    for (var i = 0; i < files.length; ++i) {
        (function (file) {
            say("file " + file.name + " " + file.size + " bytes " + file.type);
            var reader = new FileReader();
            reader.onload = function () {
                say("read " + file.name + ": " + reader.result.trim());
                if (!--pending)
                    send();
            };
            reader.readAsText(file);
        })(files[i]);
    }
    function send() {
        var data = new FormData();
        data.append("count", String(files.length));
        data.append("first", files[0]);
        files[0].slice(4, 9).text().then(function (part) {
            say("slice " + part);
            return fetch("/echo", { method: "POST", body: data });
        }).then(function (response) { return response.text(); }).then(function (text) {
            var body = text.replace(/<[^>]*>/g, "").replace(/WebKitFormBoundary[A-Za-z0-9]*/g, "WebKitFormBoundary");
            say("sent: " + body.split("\n").filter(function (line) { return line.indexOf("filename=") >= 0 || line.indexOf("body ") == 0; }).join(" | "));
            document.title = "upload done";
        });
    }
};
</script>
