<!DOCTYPE html>
<title>download slow</title>
<style>body { margin: 0; background: #3366cc; } p { color: white; margin: 20px; font: 16px sans-serif; }</style>
<p>A link to 2 MiB sent slowly as an attachment (Voyager's downloads button and popover).</p>
<a id="slow" href="/download/slow">slow</a>
<script>
window.onload = function () { setTimeout(function () { document.getElementById("slow").click(); }, 500); };
</script>
