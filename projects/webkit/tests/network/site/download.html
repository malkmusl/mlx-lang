<!DOCTYPE html>
<title>download</title>
<p>Links that download: a link's download attribute (twice: the second
file is kept apart), a Blob's URL, a data: URL, then a response that is
an attachment (Content-Disposition).</p>
<a id="note" href="/files/note.txt" download="note.txt">note</a>
<a id="blob" download="blob.txt">blob</a>
<a id="data" href="data:text/plain,data%20URL%20bytes%0A" download="data.txt">data</a>
<a id="attachment" href="/download/attachment">attachment</a>
<script>
var blob = new Blob(["made by the page's script\n"], { type: "text/plain" });
document.getElementById("blob").href = URL.createObjectURL(blob);
var steps = ["note", "note", "blob", "data", "attachment"];
function next(index) {
    if (index == steps.length) {
        document.title = "download done";
        return;
    }
    document.getElementById(steps[index]).click();
    setTimeout(function () { next(index + 1); }, 300);
}
next(0);
</script>
