<!DOCTYPE html>
<title>download post</title>
<p>A form sent with POST whose answer is an attachment: downloaded from
that one request (no second one, which a GET would have made).</p>
<form id="form" method="post" action="/download/post"><input name="item" value="three apples"></form>
<script>
window.onload = function () { setTimeout(function () { document.getElementById("form").submit(); }, 0); };
</script>
