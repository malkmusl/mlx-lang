<!DOCTYPE html>
<title>scheme</title>
<!-- An http page that tries to reach the internal scheme test: (webcore-dump
     --scheme test, as Voyager's voyager:): fetch, XMLHttpRequest (async and
     synchronous), an image, a script, a style sheet, an iframe, a fetch
     redirected there (/to-scheme), then navigations: a link clicked, a form
     submitted, location assigned. Each must fail, the page stay, and the
     scheme never be asked (webcore-dump lists what it was asked: none). -->
<body>
<script>
function line(text) { document.body.appendChild(document.createElement("p")).textContent = text; }
function settle(name, promise) {
    return promise.then(() => line(name + ": loaded (wrong)"), () => line(name + ": refused"));
}
function element(name, tag, attribute) {
    return new Promise((resolve, reject) => {
        const node = document.createElement(tag);
        if (tag === "link") node.rel = "stylesheet";
        node.onload = resolve;
        node.onerror = reject;
        node[attribute] = "test://page/data.txt";
        document.body.appendChild(node);
        setTimeout(() => reject("no event"), 1500);
    });
}
const steps = [
    () => settle("fetch", fetch("test://page/data.txt")),
    () => settle("fetch no-cors", fetch("test://page/data.txt", { mode: "no-cors" })),
    () => settle("redirect", fetch("/to-scheme")),
    () => settle("xhr", new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "test://page/data.txt");
        xhr.onload = resolve;
        xhr.onerror = reject;
        xhr.send();
    })),
    () => settle("xhr sync", new Promise((resolve, reject) => {
        try {
            const xhr = new XMLHttpRequest();
            xhr.open("GET", "test://page/data.txt", false);
            xhr.send();
            xhr.responseText.length ? resolve() : reject();
        } catch (e) { reject(e); }
    })),
    () => settle("image", element("image", "img", "src")),
    () => settle("script", element("script", "script", "src")),
    () => settle("style sheet", element("style sheet", "link", "href")),
    () => new Promise(resolve => {
        const frame = document.createElement("iframe");
        frame.src = "test://page";
        document.body.appendChild(frame);
        setTimeout(() => { line("iframe: added"); resolve(); }, 1000);
    }),
];
let chain = Promise.resolve();
for (const step of steps)
    chain = chain.then(step);
chain.then(() => {
    const link = document.createElement("a");
    link.href = "test://page";
    document.body.appendChild(link);
    link.click();
    const form = document.createElement("form");
    form.action = "test://page";
    document.body.appendChild(form);
    form.submit();
    location.href = "test://page";
    setTimeout(() => { line("navigations: the page stayed"); document.title = "scheme done"; }, 1500);
});
</script>
</body>
