<!DOCTYPE html>
<title>cookies</title>
<script>
// /set-cookie sets session and pref (HttpOnly: no script sees it); the
// page sets one of its own and asks the server which it was sent.
var setter = new XMLHttpRequest();
setter.open("GET", "/set-cookie", false);
setter.send();
document.cookie = "script=yes; path=/";
var shown = document.cookie.split("; ").sort().join("; ");
var xhr = new XMLHttpRequest();
xhr.open("GET", "/cookies", false);
xhr.send();
var sent = xhr.responseText.split("; ").sort().join("; ");
document.write("<p>document.cookie: " + shown + "</p><p>sent to the server: " + sent + "</p>");
</script>
