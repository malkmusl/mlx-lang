<!DOCTYPE html>
<title>websocket</title>
<script>
function line(text) { document.body.appendChild(document.createElement("p")).textContent = text; }
var socket = new WebSocket((location.protocol == "https:" ? "wss://" : "ws://") + location.host + "/ws");
socket.binaryType = "arraybuffer";
var step = 0;
socket.onopen = function () {
    line("open, extensions " + (socket.extensions || "none"));
    socket.send("hello over a WebSocket, hello over a WebSocket, hello over a WebSocket");
};
socket.onmessage = function (event) {
    if (typeof event.data == "string") {
        line("text: " + event.data);
        socket.send(new Uint8Array([1, 2, 3, 250]).buffer);
    } else {
        line("binary: " + Array.from(new Uint8Array(event.data)).join(","));
        socket.close(1000, "done");
    }
};
socket.onclose = function (event) { line("closed " + event.code + " clean " + event.wasClean); document.title = "websocket done"; };
socket.onerror = function () { line("error"); };
</script>
