<!DOCTYPE html>
<title>download count</title>
<pre id="out"></pre>
<script>
// What the server saw of the downloads before: one POST, and the large
// file's requests (a Range among them where one was paused).
fetch("/download/requests").then(function (response) { return response.text(); }).then(function (text) {
    document.getElementById("out").textContent = text;
    document.title = "download count done";
});
</script>
