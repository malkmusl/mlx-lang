<!DOCTYPE html>
<title>fetch</title>
<script>
function line(text) { document.body.appendChild(document.createElement("p")).textContent = text; }
fetch("/json").then(response => {
    line("fetch status " + response.status + " " + response.headers.get("content-type"));
    return response.json();
}).then(json => {
    line("fetch json answer " + json.answer + " items " + json.items.join(","));
    return fetch("/echo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ hello: "world" }) });
}).then(response => response.text()).then(text => {
    line("fetch post: " + text.replace(/\n/g, " | "));
    document.title = "fetch done";
}).catch(error => line("fetch failed: " + error));
</script>
