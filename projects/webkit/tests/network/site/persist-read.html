<!DOCTYPE html>
<title>cookies read</title>
<script>
// A second run of the profile of persist-set.html, more than a second
// later: kept is read from the profile's cookie database; brief has
// expired, temporary died with the first process.
var xhr = new XMLHttpRequest();
xhr.open("GET", "/cookies", false);
xhr.send();
document.write("<p>sent to the server: " + xhr.responseText.split("; ").sort().join("; ") + "</p><p>document.cookie: " + document.cookie + "</p>");
</script>
