<!DOCTYPE html>
<title>upload</title>
<form id="form" method="post" action="/echo" enctype="multipart/form-data">
<input name="note" value="with a file">
<input id="file" type="file" name="file" accept=".txt,text/plain">
</form>
<script>
document.getElementById("file").onchange = function () { document.getElementById("form").submit(); };
</script>
