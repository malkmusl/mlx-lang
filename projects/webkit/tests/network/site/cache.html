<!DOCTYPE html>
<title>cache</title>
<p id=out>loading</p>
<script>
// Three responses fetched as a page fetches them (the default cache mode):
// one fresh for an hour (max-age), one with an ETag that must be validated
// each time (no-cache), one never stored (no-store); then what the server
// saw of them. A second run of the same profile finds the first in the
// HTTP cache on disk (no request), revalidates the second (a 304), and
// fetches the third again.
const out = [];
const paths = ['/cache/max-age', '/cache/etag', '/cache/no-store'];
paths.reduce((done, path) => done.then(() => fetch(path)).then(r => r.text().then(t => out.push(path + ': ' + r.status + ' ' + t))), Promise.resolve())
    .then(() => fetch('/cache/requests', { cache: 'no-store' }))
    .then(r => r.text())
    .then(t => { out.push(t.trim()); })
    .catch(e => { out.push('failed: ' + e); })
    .then(() => { document.getElementById('out').innerText = out.join('\n'); document.title = 'cache done'; });
</script>
