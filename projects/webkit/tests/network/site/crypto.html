<!DOCTYPE html>
<title>crypto</title>
<pre id="out"></pre>
<script>
// Known-answer vectors of the algorithms the layout tests of crypto/subtle
// have none of (RFC 8032's Ed25519 test 1, RFC 7748's X25519 exchange,
// RFC 6979's ECDSA P-256 signature of "sample"), DER round trips of their
// keys, and crypto's random values.
var out = document.getElementById("out");
function say(text) { out.textContent += text + "\n"; }
function hex(buffer) { return Array.from(new Uint8Array(buffer), function (b) { return b.toString(16).padStart(2, "0"); }).join(""); }
function bytes(text) { var result = new Uint8Array(text.length / 2); for (var i = 0; i < result.length; ++i) result[i] = parseInt(text.substr(i * 2, 2), 16); return result; }
function b64url(text) { return btoa(String.fromCharCode.apply(null, bytes(text))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
var subtle = crypto.subtle;
var edSecret = "9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60";
var edPublic = "d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a";
var alice = "77076d0a7318a57d3c16c17251b26645df4c2f87ebc0992ab177fba51db92c2a";
var alicePublic = "8520f0098930a754748b7ddcb43ef75a0dbf3a0d26381af4eba4a98eaa9b4e6a";
var bobPublic = "de9edb7d7b7dc1b4d35b61c2ece435373f8343c85b78674dadfc7e146f882b4f";
(async function () {
    try {
        var ed = await subtle.importKey("jwk", { kty: "OKP", crv: "Ed25519", d: b64url(edSecret), x: b64url(edPublic) }, "Ed25519", true, ["sign"]);
        say("ed25519 signature " + hex(await subtle.sign("Ed25519", ed, new Uint8Array(0))));
        var pkcs8 = await subtle.exportKey("pkcs8", ed);
        say("ed25519 pkcs8 " + hex(pkcs8));
        var edVerify = await subtle.importKey("raw", bytes(edPublic), "Ed25519", true, ["verify"]);
        say("ed25519 spki " + hex(await subtle.exportKey("spki", edVerify)));
        var again = await subtle.importKey("pkcs8", pkcs8, "Ed25519", true, ["sign"]);
        var signature = await subtle.sign("Ed25519", again, new TextEncoder().encode("abc"));
        say("ed25519 verifies " + await subtle.verify("Ed25519", edVerify, signature, new TextEncoder().encode("abc")) + ", not another message " + await subtle.verify("Ed25519", edVerify, signature, new TextEncoder().encode("abd")));

        var x = await subtle.importKey("jwk", { kty: "OKP", crv: "X25519", d: b64url(alice), x: b64url(alicePublic) }, "X25519", true, ["deriveBits"]);
        var peer = await subtle.importKey("raw", bytes(bobPublic), "X25519", true, []);
        say("x25519 shared " + hex(await subtle.deriveBits({ name: "X25519", public: peer }, x, 256)));
        say("x25519 public " + (await subtle.exportKey("jwk", x)).x);

        var ec = await subtle.importKey("jwk", { kty: "EC", crv: "P-256", x: b64url("60fed4ba255a9d31c961eb74c6356d68c049b8923b61fa6ce669622e60f29fb6"), y: b64url("7903fe1008b8bc99a41ae9e95628bc64f2f1b20c2d7e9f5177a3c294d4462299") }, { name: "ECDSA", namedCurve: "P-256" }, true, ["verify"]);
        var rs = bytes("efd48b2aacb6a8fd1140dd9cd45e81d69d2c877b56aaf991c34d0ea84eaf3716f7cb1c942d657c41d436c7a1b6e29f65f3e900dbb9aff4064dc4ab2f843acda8");
        say("ecdsa p-256 verifies " + await subtle.verify({ name: "ECDSA", hash: "SHA-256" }, ec, rs, new TextEncoder().encode("sample")));
        rs[5] ^= 1;
        say("ecdsa p-256 a changed signature " + await subtle.verify({ name: "ECDSA", hash: "SHA-256" }, ec, rs, new TextEncoder().encode("sample")));
        say("ecdsa p-256 spki " + hex(await subtle.exportKey("spki", ec)));

        var random = crypto.getRandomValues(new Uint8Array(32));
        say("random values " + random.length + " bytes, " + (random.some(function (b) { return b != 0; }) ? "not all zero" : "all zero"));
        say("random UUID " + (/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(crypto.randomUUID()) ? "of version 4" : "malformed"));
        say("two UUIDs " + (crypto.randomUUID() != crypto.randomUUID() ? "differ" : "are the same"));
    } catch (error) {
        say("failed: " + error);
    }
    document.title = "crypto done";
})();
</script>
