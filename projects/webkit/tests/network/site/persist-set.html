<!DOCTYPE html>
<title>cookies kept</title>
<script>
// /set-cookie-persistent sets kept (a day), brief (a second) and temporary
// (a session cookie): all three go back while the process lives.
var setter = new XMLHttpRequest();
setter.open("GET", "/set-cookie-persistent", false);
setter.send();
var xhr = new XMLHttpRequest();
xhr.open("GET", "/cookies", false);
xhr.send();
document.write("<p>sent to the server: " + xhr.responseText.split("; ").sort().join("; ") + "</p>");
</script>
