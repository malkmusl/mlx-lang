<!DOCTYPE html>
<!-- WebGL (M8): a texture from an image (support/quadrants.png, through
     texImage2D, flipped to GL's rows) on a quad filling the canvas,
     sampled nearest at four times its size; the fragment shader keeps
     the texels' colours opaque (references: make_references.py). -->
<style>
html, body { margin: 0; }
canvas { position: absolute; left: 20px; top: 20px; }
img { display: none; }
</style>
<img id="image" src="support/quadrants.png">
<canvas id="canvas" width="160" height="160"></canvas>
<script>
function draw() {
    const gl = document.getElementById("canvas").getContext("webgl");
    function shader(type, source) {
        const s = gl.createShader(type);
        gl.shaderSource(s, source);
        gl.compileShader(s);
        return s;
    }
    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, "attribute vec2 position; varying vec2 coordinate; void main() { coordinate = position * 0.5 + 0.5; gl_Position = vec4(position, 0.0, 1.0); }"));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, "precision mediump float; uniform sampler2D image; varying vec2 coordinate; void main() { gl_FragColor = vec4(texture2D(image, coordinate).rgb, 1.0); }"));
    gl.linkProgram(program);
    gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, "position");
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(position);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, document.getElementById("image"));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.uniform1i(gl.getUniformLocation(program, "image"), 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
window.addEventListener("load", draw);
</script>
