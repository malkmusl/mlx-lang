<!DOCTYPE html>
<!-- Ahem text: every glyph a square of the font size, the space one
     blank, so the painting is known to the pixel (references:
     make_references.py). -->
<style>
html, body { margin: 0; }
div { position: absolute; font-family: Ahem; white-space: pre; }
</style>
<div style="left: 10px; top: 10px; font-size: 20px; line-height: 20px; color: #000080">XXX XX</div>
<div style="left: 10px; top: 50px; font-size: 40px; line-height: 40px; color: #008000">X X</div>
<div style="left: 200px; top: 10px; font-size: 10px; line-height: 10px; color: #c00000">XX<br>X X<br>XX</div>
