<!DOCTYPE html>
<!-- A fixed element over content scrolled by 250 pixels (M8: the main
     frame's scrolled layer and the fixed layer positioned apart): the
     fixed box stays at (20, 20), the bands move up (no scrollbar shown;
     references: make_references.py). -->
<style>
html { scrollbar-width: none; }
html, body { margin: 0; }
#fixed { position: fixed; z-index: 1; left: 20px; top: 20px; width: 200px; height: 60px; background: #ff0000; }
.band { position: absolute; left: 0; width: 800px; height: 100px; }
</style>
<div id="fixed"></div>
<div class="band" style="top: 0; background: #ffff00"></div>
<div class="band" style="top: 300px; background: #0000ff"></div>
<div class="band" style="top: 500px; background: #00a000"></div>
<div style="position: absolute; top: 2000px; width: 1px; height: 1px"></div>
<script>window.scrollTo(0, 250);</script>
