<!DOCTYPE html>
<!-- The desktop's colour scheme (webcore-dump --dark: the page's dark
     appearance, Page::setUseColorAppearance) and the port's theme
     (RenderThemeMlx.cpp, ControlFactoryMlx.cpp: std.ui.theme's light and
     dark palettes): the page allows both schemes (color-scheme), so the
     view's background is the theme's Canvas, light or dark; a box whose
     colour a prefers-color-scheme query picks; a box of the CanvasText
     system colour; a text field, a button, a checked check box and a
     select as the theme draws them in the scheme; a box of ButtonFace;
     text selected (Ahem: its glyphs CanvasText, the selection the accent,
     translucent, between them) (references: make_references.py). -->
<style>
:root { color-scheme: light dark; }
html, body { margin: 0; }
div, input, button, select { position: absolute; margin: 0; }
#scheme { left: 10px; top: 10px; width: 100px; height: 100px; background: #ff8000; }
@media (prefers-color-scheme: dark) { #scheme { background: #0080ff; } }
#text { left: 130px; top: 10px; width: 100px; height: 100px; background: CanvasText; }
#face { left: 250px; top: 10px; width: 100px; height: 100px; background: ButtonFace; }
#field { left: 10px; top: 130px; width: 200px; height: 40px; padding: 0; box-sizing: border-box; }
#button { left: 250px; top: 130px; width: 100px; height: 40px; padding: 0; }
#check { left: 370px; top: 130px; width: 20px; height: 20px; }
#select { left: 250px; top: 190px; width: 120px; height: 30px; padding: 0; }
#selected { left: 10px; top: 190px; font: 20px/20px Ahem; color: CanvasText; white-space: pre; }
</style>
<div id="scheme"></div>
<div id="text"></div>
<div id="face"></div>
<input id="field">
<button id="button"></button>
<input id="check" type="checkbox" checked>
<select id="select"><option></option></select>
<div id="selected">X X</div>
<script>getSelection().selectAllChildren(document.getElementById("selected"));</script>
