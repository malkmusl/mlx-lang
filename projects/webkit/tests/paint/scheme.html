<!DOCTYPE html>
<!-- The desktop's colour scheme (webcore-dump --dark: the page's dark
     appearance, Page::setUseColorAppearance): the page allows both
     schemes (color-scheme), so the view's background is the theme's
     Canvas, light or dark; a box whose colour a prefers-color-scheme query
     picks; a box of the CanvasText system colour; a text field the theme
     (RenderThemeAdwaita) draws in the scheme (references:
     make_references.py). -->
<style>
:root { color-scheme: light dark; }
html, body { margin: 0; }
div, input { position: absolute; margin: 0; }
#scheme { left: 10px; top: 10px; width: 100px; height: 100px; background: #ff8000; }
@media (prefers-color-scheme: dark) { #scheme { background: #0080ff; } }
#text { left: 130px; top: 10px; width: 100px; height: 100px; background: CanvasText; }
#field { left: 10px; top: 130px; width: 200px; height: 40px; padding: 0; box-sizing: border-box; }
</style>
<div id="scheme"></div>
<div id="text"></div>
<input id="field">
