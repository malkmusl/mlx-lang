<!DOCTYPE html>
<!-- Perspective without a rotation (M8: a projective layer transform that
     stays flat): a 100x100 card brought 200 pixels nearer under a
     perspective of 400 pixels is shown twice its size about the
     perspective origin, the centre of its 400x400 stage (references:
     make_references.py). -->
<style>
html, body { margin: 0; }
#stage { position: absolute; left: 200px; top: 100px; width: 400px; height: 400px; perspective: 400px; }
#card { position: absolute; left: 150px; top: 150px; width: 100px; height: 100px; background: #0000ff; transform: translateZ(200px); }
</style>
<div id="stage"><div id="card"></div></div>
