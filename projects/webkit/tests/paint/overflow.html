<!DOCTYPE html>
<!-- An overflow: scroll box scrolled by 150 pixels (M8: its contents on a
     scrolled layer of their own, clipped by the box): rows of 100 pixels,
     red, green, blue, yellow, shown from the green one's middle (no
     scrollbar shown; references: make_references.py). -->
<style>
html, body { margin: 0; }
#scroller { position: absolute; left: 50px; top: 50px; width: 300px; height: 200px; overflow: scroll; scrollbar-width: none; background: #ffffff; }
.row { height: 100px; }
</style>
<div id="scroller">
  <div class="row" style="background: #ff0000"></div>
  <div class="row" style="background: #00a000"></div>
  <div class="row" style="background: #0000ff"></div>
  <div class="row" style="background: #ffff00"></div>
</div>
<script>document.getElementById('scroller').scrollTop = 150;</script>
