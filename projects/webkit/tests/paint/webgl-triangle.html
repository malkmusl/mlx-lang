<!DOCTYPE html>
<!-- WebGL (M8): a triangle drawn by a vertex and a fragment shader on a
     cleared canvas without antialiasing (its edges are where pixels'
     centres are), ANGLE on Vulkan, read back into the canvas' layer
     (references: make_references.py, pixel centres inside the triangle). -->
<style>
html, body { margin: 0; }
canvas { position: absolute; left: 20px; top: 20px; }
</style>
<canvas id="canvas" width="200" height="200"></canvas>
<script>
const gl = document.getElementById("canvas").getContext("webgl", { antialias: false });
function shader(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    return s;
}
const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, "attribute vec2 position; void main() { gl_Position = vec4(position, 0.0, 1.0); }"));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, "precision mediump float; void main() { gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }"));
gl.linkProgram(program);
gl.useProgram(program);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.8, -0.8, 0.8, -0.8, 0.0, 0.8]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, "position");
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
gl.enableVertexAttribArray(position);
gl.clearColor(0.0, 0.0, 1.0, 1.0);
gl.clear(gl.COLOR_BUFFER_BIT);
gl.drawArrays(gl.TRIANGLES, 0, 3);
</script>
