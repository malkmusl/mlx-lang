<!DOCTYPE html>
<!-- Composited layers (M8): boxes on layers of their own, painted into
     their tiles and composited on the CPU with their transforms and
     opacity: a translation (will-change: transform), a scale from the
     corner, a quarter turn about the centre (100x40 shown 40x100), a
     translucent layer, and a translucent group of two boxes that overlap
     (group opacity: where they overlap only the top one shows, at half;
     references: make_references.py). -->
<style>
html, body { margin: 0; }
div { position: absolute; }
</style>
<div style="left: 0; top: 0; width: 100px; height: 50px; background: #ff0000; transform: translate(10px, 20px); will-change: transform"></div>
<div style="left: 150px; top: 10px; width: 50px; height: 40px; background: #00a000; transform: scale(2); transform-origin: 0 0; will-change: transform"></div>
<div style="left: 300px; top: 40px; width: 100px; height: 40px; background: #0000ff; transform: rotate(90deg); will-change: transform"></div>
<div style="left: 10px; top: 200px; width: 100px; height: 100px; background: #0000ff; opacity: 0.5; will-change: opacity"></div>
<div style="left: 200px; top: 200px; width: 200px; height: 100px; opacity: 0.5; will-change: opacity">
  <div style="left: 0; top: 0; width: 120px; height: 100px; background: #ff0000"></div>
  <div style="left: 80px; top: 0; width: 120px; height: 100px; background: #008000"></div>
</div>
