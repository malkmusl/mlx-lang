<!DOCTYPE html>
<!-- Borders and outlines of one colour each (no diagonal joins between
     colours), the background under a border (references:
     make_references.py). -->
<style>
html, body { margin: 0; }
div { position: absolute; }
</style>
<div style="left: 20px; top: 20px; width: 100px; height: 60px; border: 10px solid #000000; background: #cccccc"></div>
<div style="left: 200px; top: 20px; width: 80px; height: 80px; border-style: solid; border-width: 4px 8px 12px 16px; border-color: #0000ff"></div>
<div style="left: 40px; top: 160px; width: 100px; height: 50px; background: #ffcc00; outline: 5px solid #008000; outline-offset: 5px"></div>
<div style="left: 300px; top: 150px; width: 60px; height: 60px; border-left: 20px solid #800000"></div>
