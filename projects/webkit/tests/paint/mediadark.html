<!DOCTYPE html>
<!-- A page with a dark design of its own given by a prefers-color-scheme
     query alone (no color-scheme): with webcore-dump --dark --force-dark
     its own dark colours are painted, forced dark leaves it as it is
     (references: make_references.py). -->
<style>
html, body { margin: 0; background: white; }
div { position: absolute; margin: 0; left: 10px; top: 10px; width: 100px; height: 50px; background: #3366cc; }
@media (prefers-color-scheme: dark) { html, body { background: #202020; } div { background: #80a0ff; } }
</style>
<div></div>
