<!DOCTYPE html>
<!-- Forced dark mode (webcore-dump --dark --force-dark: the port's
     MlxDarkMode.h): a light page with no dark design of its own (no
     color-scheme, no prefers-color-scheme rule) painted dark: its white
     canvas, its black Ahem text, a blue box and a light one get their
     lightness inverted (in OKLab, the hue kept); the image keeps its
     pixels, its translucent quadrant over the darkened canvas
     (references: make_references.py). -->
<style>
html, body { margin: 0; background: white; }
div, img { position: absolute; margin: 0; }
#text { left: 10px; top: 10px; font: 20px/20px Ahem; color: black; white-space: pre; }
#blue { left: 10px; top: 50px; width: 100px; height: 50px; background: #3366cc; }
#light { left: 130px; top: 50px; width: 100px; height: 50px; background: #ffe0a0; }
</style>
<div id="text">XX X</div>
<div id="blue"></div>
<div id="light"></div>
<img src="support/quadrants.png" style="left: 10px; top: 120px; width: 80px; height: 80px; image-rendering: pixelated">
