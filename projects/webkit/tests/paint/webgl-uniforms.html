<!DOCTYPE html>
<!-- WebGL (M8): one unit square drawn four times, placed, sized and
     coloured by uniforms (a vec2 resolution, a vec4 rectangle and a vec4
     colour, set between the draws) on a grey canvas (references:
     make_references.py). -->
<style>
html, body { margin: 0; }
canvas { position: absolute; left: 20px; top: 20px; }
</style>
<canvas id="canvas" width="240" height="120"></canvas>
<script>
const gl = document.getElementById("canvas").getContext("webgl");
function shader(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    return s;
}
const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER,
    "attribute vec2 corner; uniform vec2 resolution; uniform vec4 rectangle;" +
    "void main() { vec2 pixel = rectangle.xy + corner * rectangle.zw; vec2 clip = pixel / resolution * 2.0 - 1.0; gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0); }"));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, "precision mediump float; uniform vec4 colour; void main() { gl_FragColor = colour; }"));
gl.linkProgram(program);
gl.useProgram(program);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
const corner = gl.getAttribLocation(program, "corner");
gl.vertexAttribPointer(corner, 2, gl.FLOAT, false, 0, 0);
gl.enableVertexAttribArray(corner);
gl.uniform2f(gl.getUniformLocation(program, "resolution"), 240, 120);
gl.clearColor(0.8, 0.8, 0.8, 1.0);
gl.clear(gl.COLOR_BUFFER_BIT);
const rectangle = gl.getUniformLocation(program, "rectangle");
const colour = gl.getUniformLocation(program, "colour");
const rectangles = [
    [[10, 10, 100, 40], [1, 0, 0, 1]],
    [[130, 10, 60, 100], [0, 1, 0, 1]],
    [[10, 60, 40, 50], [0, 0, 1, 1]],
    [[70, 70, 40, 20], [1, 1, 0, 1]],
];
for (const [r, c] of rectangles) {
    gl.uniform4fv(rectangle, r);
    gl.uniform4fv(colour, c);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
</script>
