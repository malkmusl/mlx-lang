# The Mlx port's settings: read by webkit-settings (generators/
# webcoresettings.mlx) after WTF's UnifiedWebPreferences.yaml and
# WebCore's page/Settings.yaml; a setting named here replaces WebKit's
# (webcore.mlx, Derived.settings). Names in sorted order.
#
# HardwareAccelerationEnabled: WebKit has it for GTK and the WPE platform
# only, but Page.cpp reads it for any Skia port
# (`USE(SKIA) && !PLATFORM(WIN) && (!PLATFORM(WPE) || ENABLE(WPE_PLATFORM))`)
# to offer accelerated filters. The Mlx port draws with Skia on the CPU
# (PORT.md): the setting is there, off.
#
# WebGLEnabled: on in WebCore too (WebKit's WebCore default is off, the
# WebKit layer turning it on): the port has WebGL on ANGLE's Vulkan
# backend (PORT.md, "WebGL").

HardwareAccelerationEnabled:
  type: bool
  status: internal
  humanReadableName: "Hardware acceleration"
  humanReadableDescription: "Enable hardware acceleration"
  defaultValue:
    WebKitLegacy:
      default: false
    WebKit:
      default: false
    WebCore:
      default: false

WebGLEnabled:
  type: bool
  status: mature
  humanReadableName: "WebGL"
  humanReadableDescription: "Enable WebGL"
  defaultValue:
    WebKitLegacy:
      default: true
    WebKit:
      default: true
    WebCore:
      default: true
  disableInLockdownMode: true
  sharedPreferenceForWebProcess: true
  richJavaScript: true
