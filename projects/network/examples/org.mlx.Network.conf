<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- mlx-netd on D-Bus's system bus (MLXIPC's lets only root own names
     anyway): root owns org.mlx.Network and NetworkManager's name; anyone
     may ask what is connected and what is in sight, and scan; joining,
     leaving, forgetting and switching links is for the users at the
     machine and the netdev group. -->
<busconfig>
  <policy user="root">
    <allow own="org.mlx.Network"/>
    <allow own="org.freedesktop.NetworkManager"/>
    <allow send_destination="org.mlx.Network"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.mlx.Network" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.mlx.Network" send_interface="org.mlx.Network" send_member="Devices"/>
    <allow send_destination="org.mlx.Network" send_interface="org.mlx.Network" send_member="Networks"/>
    <allow send_destination="org.mlx.Network" send_interface="org.mlx.Network" send_member="Scan"/>
    <allow send_destination="org.freedesktop.NetworkManager"/>
  </policy>
  <policy group="netdev">
    <allow send_destination="org.mlx.Network"/>
  </policy>
  <policy at_console="true">
    <allow send_destination="org.mlx.Network"/>
  </policy>
</busconfig>
