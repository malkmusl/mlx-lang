# /etc/mlx/network.conf: mlx-netd's links (projects/network/README.md).
# Without this file every cable and Wi-Fi card is configured by DHCP.

# Said to DHCP servers (else /etc/hostname).
#hostname = laptop

# Links left alone (names; a trailing '*' takes the rest). This is the
# default; containers' and VMs' bridges and taps stay theirs.
#ignore = docker* veth* virbr* br-* vnet* tap* tun*

# A link with fixed settings:
#eth1.method = static
#eth1.address = 192.168.1.5/24
#eth1.gateway = 192.168.1.1
#eth1.dns = 1.1.1.1 9.9.9.9
#eth1.metric = 50

# A link mlx-netd keeps down:
#eth2.method = off
