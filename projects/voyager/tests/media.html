<!doctype html>
<!-- A video (WebKit's test.mp4: 6 s, H.264 and silent AAC) playing by
     itself: the page says where it is through its title ("media:playing",
     then "media:ended:SECONDS") and its background: green while it
     plays, blue when it ended. tools/check_voyager.sh reads both. -->
<title>media:loading</title>
<style>
body { margin: 0; background: #ffffff; }
video { display: block; width: 320px; height: 240px; margin: 40px; }
</style>
<video id="video" autoplay muted playsinline src="../../webkit/upstream/Tools/TestWebKitAPI/Resources/test.mp4"></video>
<script>
const video = document.getElementById("video");
video.addEventListener("playing", () => {
    document.title = "media:playing";
    document.body.style.background = "#00c000";
});
video.addEventListener("ended", () => {
    document.title = "media:ended:" + Math.round(video.currentTime);
    document.body.style.background = "#0000c0";
});
video.addEventListener("error", () => {
    document.title = "media:error:" + (video.error ? video.error.code : 0);
    document.body.style.background = "#c00000";
});
</script>
