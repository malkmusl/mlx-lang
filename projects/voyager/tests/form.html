<!DOCTYPE html>
<!-- A form in the port's theme (RenderThemeMlx.cpp, ControlFactoryMlx.cpp:
     std.ui.theme's light and dark palettes): the page allows both
     schemes, so on a dark desktop its controls are drawn dark. -->
<title>form</title>
<meta name="color-scheme" content="light dark">
<style>
body { font: 15px sans-serif; margin: 24px; }
label { display: block; margin: 10px 0; }
mark { padding: 0 2px; }
</style>
<h2>A form</h2>
<label>Name <input value="Ada Lovelace"></label>
<label>Search <input type="search" placeholder="Search"></label>
<label><input type="checkbox" checked> Remember me</label>
<label><input type="checkbox"> Send news</label>
<label><input type="radio" name="r" checked> One <input type="radio" name="r"> Two</label>
<label>Colour <select><option>Blue</option><option>Green</option></select></label>
<label>Volume <input type="range" value="60"></label>
<label>Amount <input type="number" value="3"></label>
<label>Progress <progress value="0.4"></progress> Meter <meter value="0.7"></meter></label>
<label><textarea rows="2" cols="30">Some text</textarea></label>
<p><button>Cancel</button> <button>Send</button> <input type="submit" value="Submit" disabled></p>
<p id="text">Selected text, a <mark>mark</mark> and a <a href="#">link</a>.</p>
<script>
const range = document.createRange();
range.selectNodeContents(document.getElementById("text").firstChild);
getSelection().addRange(range);
</script>
