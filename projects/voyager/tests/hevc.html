<!doctype html>
<!-- An H.265 video playing by itself (hevc.mp4: 3 s of ffmpeg's testsrc,
     320x240, hvc1, made by libx265; no GPU decoder in the check, so
     std.h265.decode decodes it on the CPU): the page says where it is
     through its title ("hevc:playing", then "hevc:ended:SECONDS") and
     its background: green while it plays, blue when it ended.
     tools/check_voyager.sh reads both and the video's colours. -->
<title>hevc:loading</title>
<style>
body { margin: 0; background: #ffffff; }
video { display: block; width: 320px; height: 240px; margin: 40px; }
</style>
<video id="video" autoplay muted playsinline src="hevc.mp4"></video>
<script>
const video = document.getElementById("video");
video.addEventListener("playing", () => {
    document.title = "hevc:playing";
    document.body.style.background = "#00c000";
});
video.addEventListener("ended", () => {
    document.title = "hevc:ended:" + Math.round(video.currentTime);
    document.body.style.background = "#0000c0";
});
video.addEventListener("error", () => {
    document.title = "hevc:error:" + (video.error ? video.error.code : 0);
    document.body.style.background = "#c00000";
});
</script>
