<!DOCTYPE html>
<!-- tools/check_voyager.sh's animation (M8): a box turning and fading
     forever (CSS animations of transform and opacity, run by the
     compositor on its frame clock: frames composed, nothing painted
     again on the main thread), and a counter of animation frames
     (requestAnimationFrame, driven by the same clock) in the title once a
     second. -->
<title>animation</title>
<style>
html, body { margin: 0; }
#box { position: absolute; left: 100px; top: 100px; width: 200px; height: 200px; background: #3366cc; animation: turn 2s linear infinite, fade 1s ease-in-out infinite alternate; }
@keyframes turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes fade { from { opacity: 1; } to { opacity: 0.2; } }
</style>
<div id="box"></div>
<script>
let frames = 0;
let started = 0;
function count(now) {
    if (!started)
        started = now;
    ++frames;
    if (now - started >= 1000) {
        document.title = "raf:" + frames;
        frames = 0;
        started = now;
    }
    requestAnimationFrame(count);
}
requestAnimationFrame(count);
</script>
