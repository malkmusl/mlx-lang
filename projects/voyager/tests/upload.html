<!DOCTYPE html>
<title>upload</title>
<style>body { margin: 0; background: #3366cc; } input { position: absolute; left: 20px; top: 20px; width: 300px; height: 60px; font: 20px sans-serif; }</style>
<input id="file" type="file" accept=".txt">
<script>
document.getElementById("file").onchange = function () {
    var file = this.files[0];
    var reader = new FileReader();
    reader.onload = function () { document.title = "uploaded:" + file.name + ":" + reader.result.trim(); };
    reader.readAsText(file);
};
</script>
