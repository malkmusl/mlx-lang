<!DOCTYPE html>
<!-- tools/check_voyager.sh's page for the desktop's colour scheme: it
     allows both (color-scheme), so Voyager's dark appearance draws its
     canvas and its text field dark; a box whose colour a
     prefers-color-scheme query picks; the title says the scheme the page
     sees ("scheme:dark", "scheme:light"), again when it changes. The blue
     box says where the page is on the screen. -->
<title>scheme</title>
<style>
:root { color-scheme: light dark; }
html, body { margin: 0; }
#link { position: absolute; left: 20px; top: 20px; width: 200px; height: 40px; background: #3366cc; }
#scheme { position: absolute; left: 20px; top: 80px; width: 100px; height: 40px; background: #ff8000; }
@media (prefers-color-scheme: dark) { #scheme { background: #0080ff; } }
#field { position: absolute; left: 20px; top: 140px; width: 300px; height: 30px; margin: 0; }
</style>
<div id="link"></div>
<div id="scheme"></div>
<input id="field">
<script>
const dark = matchMedia("(prefers-color-scheme: dark)");
const show = () => { document.title = "scheme:" + (dark.matches ? "dark" : "light"); };
dark.addEventListener("change", show);
show();
</script>
