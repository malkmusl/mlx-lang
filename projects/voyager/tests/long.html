<!DOCTYPE html>
<!-- tools/check_voyager.sh's long page (M8): text and coloured bands over
     20000 pixels, scrolled by the wheel on the scrolling thread (the
     layers moved, nothing painted again on the main thread: the engine's
     "compositor paints P frames F" lines tell). The title says how far
     the page is scrolled once the main thread hears of it. -->
<title>long</title>
<style>
html, body { margin: 0; }
body { font: 16px/24px sans-serif; }
section { height: 400px; padding: 20px; box-sizing: border-box; }
section:nth-child(odd) { background: #e8f0ff; }
section:nth-child(even) { background: #fff4e0; }
h2 { margin: 0 0 10px; }
</style>
<script>
for (let i = 0; i < 50; ++i) {
    document.write(`<section><h2>Section ${i + 1}</h2><p>` + "The quick brown fox jumps over the lazy dog. ".repeat(20) + `</p></section>`);
}
window.addEventListener("scroll", () => { document.title = "long:" + window.scrollY; });
</script>
