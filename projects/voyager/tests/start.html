<!DOCTYPE html>
<!-- tools/check_voyager.sh's first page: what it does shows in the title
     (Voyager writes each new one): the page scrolled, text typed and
     pasted into the field, the link followed to second.html. -->
<title>start</title>
<style>
html, body { margin: 0; }
body { height: 3000px; }
#link { position: absolute; left: 20px; top: 20px; width: 200px; height: 40px; background: #3366cc; display: block; }
#field { position: absolute; left: 20px; top: 100px; width: 300px; height: 30px; font-size: 20px; }
</style>
<a id="link" href="second.html"></a>
<input id="field" oninput="document.title = 'typed:' + this.value">
<script>
window.addEventListener("scroll", () => { document.title = "scrolled:" + window.scrollY; });
</script>
