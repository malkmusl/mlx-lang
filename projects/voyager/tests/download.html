<!DOCTYPE html>
<title>download</title>
<style>body { margin: 0; background: #3366cc; } p { color: white; margin: 20px; font: 16px sans-serif; }</style>
<p>Two downloads: a Blob's URL and a file's link, each with a download attribute.</p>
<a id="blob" download="voyager-blob.txt"></a>
<a id="file" href="download-note.txt" download="voyager-note.txt"></a>
<script>
var blob = new Blob(["saved from a Blob by Voyager\n"], { type: "text/plain" });
var link = document.getElementById("blob");
link.href = URL.createObjectURL(blob);
setTimeout(function () {
    link.click();
    document.getElementById("file").click();
    setTimeout(function () { document.title = "downloaded"; }, 500);
}, 500);
</script>
