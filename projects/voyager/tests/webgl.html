<!DOCTYPE html>
<!-- tools/check_voyager.sh's WebGL (M8): a canvas of 300x300 at (100, 100)
     cleared green each frame and a red triangle turning in it, drawn by
     WebGL (ANGLE on Vulkan, read back into the canvas' layer each frame)
     from requestAnimationFrame; the frames drawn a second in the title
     ("webgl:N"), once a second. -->
<title>webgl</title>
<style>
html, body { margin: 0; }
canvas { position: absolute; left: 100px; top: 100px; }
</style>
<canvas id="canvas" width="300" height="300"></canvas>
<script>
const gl = document.getElementById("canvas").getContext("webgl");
function shader(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    return s;
}
const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER,
    "attribute vec2 position; uniform float angle;" +
    "void main() { float c = cos(angle), s = sin(angle); gl_Position = vec4(c * position.x - s * position.y, s * position.x + c * position.y, 0.0, 1.0); }"));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, "precision mediump float; void main() { gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0); }"));
gl.linkProgram(program);
gl.useProgram(program);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0.0, 0.6, -0.52, -0.3, 0.52, -0.3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, "position");
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
gl.enableVertexAttribArray(position);
const angle = gl.getUniformLocation(program, "angle");
gl.clearColor(16 / 255, 160 / 255, 64 / 255, 1.0);
let frames = 0;
let started = 0;
function frame(now) {
    if (!started)
        started = now;
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(angle, now / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    ++frames;
    if (now - started >= 1000) {
        document.title = "webgl:" + frames;
        frames = 0;
        started = now;
    }
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
