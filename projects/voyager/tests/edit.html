<!doctype html>
<!-- Editing in a text area whose font is a generic family (sans-serif,
     as Google's search box has it): what is typed, and a Backspace
     (the delete command copies the computed font-family into the
     typing style, which asks the CSS value pool for each family's
     value). The title tells the text after each change; the area is
     the whole page, so a click anywhere focuses it.
     tools/check_voyager.sh types into it. -->
<title>edit:</title>
<style>
html, body { margin: 0; height: 100%; }
textarea { font-family: sans-serif; font-size: 24px; width: 100%; height: 100%; box-sizing: border-box; border: 0; background: #ffffff; }
</style>
<textarea id="area"></textarea>
<script>
const area = document.getElementById("area");
area.addEventListener("input", () => { document.title = "edit:" + area.value; });
</script>
