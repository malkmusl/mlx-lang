<!doctype html>
<!-- Editing in text areas (what is typed, and a Backspace: the delete
     command copies the computed font-family into the typing style, which
     asks the CSS value pool for each family's value): the top one's font
     is a generic family (sans-serif, as Google's search box has it), the
     bottom one's -webkit-body (the page settings' standard family, as
     YouTube's search box has it). The title tells the text of the area
     changed last ("edit:top:TEXT", "edit:bottom:TEXT"); each area is half
     the page. tools/check_voyager.sh types into both. -->
<title>edit:</title>
<style>
html, body { margin: 0; height: 100%; }
textarea { display: block; font-size: 24px; width: 100%; height: 50%; box-sizing: border-box; border: 0; background: #ffffff; }
#top { font-family: sans-serif; }
#bottom { font-family: -webkit-body; background: #f0f0f0; }
</style>
<textarea id="top"></textarea>
<textarea id="bottom"></textarea>
<script>
for (const area of document.querySelectorAll("textarea"))
    area.addEventListener("input", () => { document.title = "edit:" + area.id + ":" + area.value; });
</script>
