<!DOCTYPE html>
<title>storage</title>
<p>Counts its visits in localStorage (kept in Voyager's profile) and
notes one in sessionStorage (the tab's, gone with the process).</p>
<script>
var visits = Number(localStorage.getItem("visits") || 0) + 1;
localStorage.setItem("visits", String(visits));
var session = sessionStorage.getItem("seen") || "none";
sessionStorage.setItem("seen", "yes");
document.title = "visits:" + visits + " session:" + session;
</script>
