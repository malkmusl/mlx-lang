<!DOCTYPE html>
<!-- tools/check_voyager.sh's tabs: a link with target=_blank (blue) and a
     box whose click calls window.open (green), each opening second.html
     in a new tab; the link, middle-clicked, opens it in a tab behind. -->
<title>tabs</title>
<style>
html, body { margin: 0; }
#blank { position: absolute; left: 20px; top: 20px; width: 200px; height: 40px; background: #3366cc; display: block; }
#open { position: absolute; left: 20px; top: 80px; width: 200px; height: 40px; background: #33aa33; }
</style>
<a id="blank" href="second.html" target="_blank"></a>
<div id="open" onclick="window.open('second.html?opened')"></div>
