<!DOCTYPE html>
<!-- tools/voyager_screenshots.sh's form: the controls in the port's theme
     (RenderThemeMlx.cpp, ControlFactoryMlx.cpp: std.ui.theme's light and
     dark palettes). The page allows both schemes, so on a dark desktop
     its controls are drawn dark. -->
<html lang="en">
<meta charset="utf-8">
<title>Flight Plan</title>
<meta name="color-scheme" content="light dark">
<style>
html { font: 15px/1.5 sans-serif; }
body { margin: 0; padding: 24px 32px; }
h1 { margin: 0 0 4px; font-size: 26px; }
.dim { margin: 0 0 18px; opacity: 0.7; }
.grid { display: grid; grid-template-columns: 130px 1fr; gap: 12px 16px; align-items: center; max-width: 620px; }
.grid > span { opacity: 0.8; }
input[type=text], input[type=search], select, textarea { font: inherit; width: 300px; box-sizing: border-box; }
.inline label { margin-right: 14px; }
.buttons { margin-top: 20px; display: flex; gap: 10px; }
</style>
<h1>Flight plan</h1>
<p class="dim">Form controls drawn by the port&rsquo;s theme, light or dark with the desktop.</p>
<form class="grid" onsubmit="return false">
<span>Probe</span><input type="text" value="Voyager 2">
<span>Search</span><input type="search" placeholder="Moons, rings, fields">
<span>Target</span><select><option>Neptune</option><option>Uranus</option><option>Saturn</option></select>
<span>Instruments</span><div class="inline"><label><input type="checkbox" checked> Cameras</label><label><input type="checkbox" checked> Magnetometer</label><label><input type="checkbox"> Plasma</label></div>
<span>Antenna</span><div class="inline"><label><input type="radio" name="a" checked> High gain</label><label><input type="radio" name="a"> Low gain</label></div>
<span>Flyby distance</span><input type="range" value="35">
<span>Corrections</span><input type="number" value="3" style="width: 80px">
<span>Power</span><div><meter value="0.62"></meter> 62% &nbsp; <progress value="0.4"></progress> uploading</div>
<span>Notes</span><textarea rows="2">Close approach at 4,950 km above the cloud tops.</textarea>
</form>
<div class="buttons"><button>Cancel</button><button>Save plan</button><input type="submit" value="Launch" disabled></div>
</html>
