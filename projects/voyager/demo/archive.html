<!DOCTYPE html>
<!-- tools/voyager_screenshots.sh's downloads: links to tools/http-test-server's
     own downloads (/download/slow: 2 MiB sent over 8 seconds, which
     fills the toolbar's ring and the popover; /download/attachment: a
     small text file). The buttons are where the script clicks:
     "Raw frames" at (32, 150) to (272, 196) of the page, "Report" below it. -->
<html lang="en">
<meta charset="utf-8">
<title>Image Archive</title>
<meta name="color-scheme" content="light dark">
<style>
:root { --page: #f7f8fb; --text: #1f2430; --dim: #687086; --card: #ffffff; --line: #dfe3ec; --button: #2f6fdf; }
@media (prefers-color-scheme: dark) {
    :root { --page: #14171f; --text: #e4e7ef; --dim: #98a0b4; --card: #1d212b; --line: #2e3442; --button: #4d8bff; }
}
html { background: var(--page); color: var(--text); font: 15px/1.5 sans-serif; }
body { margin: 0; padding: 24px 32px; }
h1 { margin: 0; font-size: 26px; }
p { margin: 4px 0 0; color: var(--dim); }
a.button { position: absolute; left: 32px; width: 240px; height: 46px; box-sizing: border-box; padding: 11px 16px; border-radius: 8px; background: var(--button); color: #ffffff; text-decoration: none; font-weight: 700; }
a.button span { font-weight: 400; opacity: 0.85; }
.note { position: absolute; left: 290px; color: var(--dim); }
</style>
<h1>Image archive</h1>
<p>Raw frames of the flybys, as they came down from the Deep Space Network.</p>
<a class="button" style="top: 150px" href="/download/slow">Raw frames <span>&middot; 2 MB</span></a>
<div class="note" style="top: 162px">sent slowly, to watch it come in</div>
<a class="button" style="top: 216px" href="/download/attachment">Report <span>&middot; text</span></a>
<div class="note" style="top: 228px">a short text file</div>
</html>
