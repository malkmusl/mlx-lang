<!DOCTYPE html>
<!-- tools/voyager_screenshots.sh's animation: planets on their orbits,
     CSS animations of transform and opacity only, which Voyager's
     compositor thread runs at the display's rate without painting the
     page again. A dark design of its own (color-scheme: dark). -->
<html lang="en">
<meta charset="utf-8">
<title>Orbits</title>
<meta name="color-scheme" content="dark">
<style>
html { background: #0b0f1e; color: #dfe4f2; font: 15px/1.5 sans-serif; height: 100%; }
body { margin: 0; height: 100%; overflow: hidden; }
h1 { position: absolute; left: 28px; top: 18px; margin: 0; font-size: 24px; }
p { position: absolute; left: 28px; top: 54px; margin: 0; color: #8f99b5; }
.system { position: absolute; left: 50%; top: 52%; width: 0; height: 0; }
.sun { position: absolute; left: -34px; top: -34px; width: 68px; height: 68px; border-radius: 50%;
       background: radial-gradient(circle at 40% 40%, #fff6c8, #ffc23d 55%, #ff8a1f); box-shadow: 0 0 40px #ff9d2a; }
.glow { position: absolute; left: -60px; top: -60px; width: 120px; height: 120px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 180, 60, 0.45), rgba(255, 180, 60, 0) 70%); animation: pulse 2.4s ease-in-out infinite alternate; }
.orbit { position: absolute; border: 1px solid rgba(160, 175, 220, 0.22); border-radius: 50%; }
.arm { position: absolute; left: 0; top: 0; width: 0; height: 0; animation: turn linear infinite; }
.planet { position: absolute; border-radius: 50%; }
.star { position: absolute; width: 2px; height: 2px; background: #ffffff; border-radius: 50%; animation: twinkle 1.6s ease-in-out infinite alternate; }
@keyframes turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes pulse { from { opacity: 0.5; transform: scale(0.9); } to { opacity: 1; transform: scale(1.15); } }
@keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }
</style>
<h1>Orbits</h1>
<p>CSS animations of transform and opacity, run by the compositor thread.</p>
<div class="star" style="left: 60px; top: 140px"></div>
<div class="star" style="left: 640px; top: 90px; animation-delay: -0.5s"></div>
<div class="star" style="left: 520px; top: 520px; animation-delay: -1s"></div>
<div class="star" style="left: 110px; top: 470px; animation-delay: -0.8s"></div>
<div class="star" style="left: 690px; top: 380px; animation-delay: -0.3s"></div>
<div class="star" style="left: 300px; top: 560px; animation-delay: -1.2s"></div>
<div class="system">
  <div class="orbit" style="left: -70px; top: -70px; width: 140px; height: 140px"></div>
  <div class="orbit" style="left: -115px; top: -115px; width: 230px; height: 230px"></div>
  <div class="orbit" style="left: -170px; top: -170px; width: 340px; height: 340px"></div>
  <div class="orbit" style="left: -235px; top: -235px; width: 470px; height: 470px"></div>
  <div class="glow"></div>
  <div class="sun"></div>
  <div class="arm" style="animation-duration: 3s"><div class="planet" style="left: 64px; top: -6px; width: 12px; height: 12px; background: #b9b2a8"></div></div>
  <div class="arm" style="animation-duration: 5s; animation-delay: -2s"><div class="planet" style="left: 106px; top: -9px; width: 18px; height: 18px; background: radial-gradient(circle at 35% 35%, #9fd3ff, #2a6fd6)"></div></div>
  <div class="arm" style="animation-duration: 8s; animation-delay: -5s"><div class="planet" style="left: 156px; top: -14px; width: 28px; height: 28px; background: radial-gradient(circle at 35% 35%, #ffe0b0, #d2884a)"></div></div>
  <div class="arm" style="animation-duration: 13s; animation-delay: -3s"><div class="planet" style="left: 220px; top: -15px; width: 30px; height: 30px; background: radial-gradient(circle at 35% 35%, #fff1c9, #d9b061)"></div></div>
</div>
</html>
