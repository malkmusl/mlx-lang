<!DOCTYPE html>
<!-- tools/voyager_screenshots.sh's upload: a file input (at (32, 120) of
     the page, 320 x 48) whose click opens Voyager's file chooser. -->
<html lang="en">
<meta charset="utf-8">
<title>Postcard</title>
<meta name="color-scheme" content="light dark">
<style>
html { font: 15px/1.5 sans-serif; }
body { margin: 0; padding: 24px 32px; }
h1 { margin: 0; font-size: 26px; }
p { margin: 4px 0 0; opacity: 0.7; }
input { position: absolute; left: 32px; top: 120px; width: 320px; height: 48px; font: inherit; }
</style>
<h1>Attach a picture</h1>
<p>A picture for the postcard, from your files.</p>
<input type="file" accept="image/*,.txt">
</html>
