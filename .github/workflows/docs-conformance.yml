name: Docs conformance

on:
  push:
    branches: [master]
    paths:
      - "tests/**"
      - "docs/**"
      - "spec/02-compiler/diagnostics/**"
      - "tools/check_docs_coverage.py"
      - ".github/workflows/docs-conformance.yml"
  pull_request:
    paths:
      - "tests/**"
      - "docs/**"
      - "spec/02-compiler/diagnostics/**"
      - "tools/check_docs_coverage.py"
      - ".github/workflows/docs-conformance.yml"
  workflow_dispatch: {}

jobs:
  check:
    name: Check docs coverage, links, fences, diagnostic codes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run docs-conformance checks
        run: python3 tools/check_docs_coverage.py
